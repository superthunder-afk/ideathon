ainer": "#746150", "surface-dim": "#dcd9d9", "on-secondary-fixed-variant": "#554334", "primary-fixed-dim": "#ffb59c", "on-primary": "#ffffff", "background": "#fcfaf7", "secondary-fixed-dim": "#dbc2ae", "outline-variant": "#dec0b7", "error-container": "#ffdad6", "primary-fixed": "#ffdbcf", "secondary-fixed": "#f8dec9" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "margin": "2rem", "gutter": "1.5rem", "space-md": "1rem", "space-xl": "2.5rem", "margin-mobile": "1.5rem", "gutter-mobile": "1.5rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "space-xs": "0.25rem" }, fontFamily: { "headline-sm": ["Plus Jakarta Sans"], "display": ["Plus Jakarta Sans"], "body-md": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "label-md": ["Inter"], "display-mobile": ["Plus Jakarta Sans"], "label-sm": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-lg": ["Inter"], "body-sm": ["Inter"] } } } };</script><style>@layer base{html,body{margin:0;padding:0;min-height:100%;background-color:#fcfaf7;color:#1b1b1c;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>

<!-- Massive Headline -->
<div class="flex flex-col gap-3">
<h1 class="font-headline-lg text-[34px] sm:text-[38px] leading-[1.18] text-on-surface font-semibold tracking-[-0.03em]">What do you want to discuss?</h1>
</div>
<!-- Minimal Large Text Topic Field -->
<div class="relative flex flex-col p-5 sm:p-6 rounded-[28px] bg-[#f4eee9] border border-[#e7ddd5] shadow-sm transition-all focus-within:border-primary/40 focus-within:bg-[#f6f0eb] focus-within:ring-2 focus-within:ring-primary/10"><textarea class="w-full bg-transparent font-headline-md text-[20px] sm:text-[22px] text-on-surface leading-[1.4] tracking-tight placeholder:text-outline/40 border-0 p-0 focus:ring-0 focus:outline-none resize-none selection:bg-secondary-container" id="topic-input" rows="3">Should artificial intelligence replace traditional education?</textarea><div class="flex items-center justify-between pt-3 border-t border-[#ded3ca]/60 text-[12px] text-secondary/60 font-medium"><span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px] text-secondary/60">edit_note</span>Topic prompt</span><span class="text-secondary/50">Tap to customize</span></div></div>
<!-- Clean Horizontal Participant Selector -->
<div class="flex flex-col gap-3 pt-2">
<span class="text-[13px] font-medium tracking-wide text-secondary uppercase">Participants</span>
<div class="flex items-center gap-6" id="count-selector">
<button class="count-item text-[22px] font-medium text-secondary/40 hover:text-secondary transition-colors" data-count="3" onclick="selectCount(3)" type="button">3</button>
<span class="text-secondary/25 text-[18px]">·</span>
<button class="count-item text-[22px] font-semibold text-primary transition-colors" data-count="4" onclick="selectCount(4)" type="button">4</button>
<span class="text-secondary/25 text-[18px]">·</span>
<button class="count-item text-[22px] font-medium text-secondary/40 hover:text-secondary transition-colors" data-count="5" onclick="selectCount(5)" type="button">5</button>
</div>
</div>
</div>
<!-- Single Zen Bottom Action -->
<div class="pt-12 pb-safe">
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-headline-sm text-[16px] font-semibold tracking-tight flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] active:opacity-95 transition-all" id="launch-arena-btn" type="button">
<span class="">Start Discussion</span>
<span class="material-symbols-outlined text-[19px]">arrow_forward</span>
</button>
</div>
</main><script>
  let selectedParticipants = 4;

  function selectCount(count) {
    selectedParticipants = count;
    const items = document.querySelectorAll('.count-item');
    items.forEach(item => {
      const c = parseInt(item.getAttribute('data-count'), 10);
      if (c === count) {
        item.className = 'count-item text-[22px] font-semibold text-primary transition-colors';
      } else {
        item.className = 'count-item text-[22px] font-medium text-secondary/40 hover:text-secondary transition-colors';
      }
    });
  }

  document.getElementById('launch-arena-btn')?.addEventListener('click', () => {
    const btn = document.getElementById('launch-arena-btn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
    setTimeout(() => {
      btn.innerHTML = '<span>Entering...</span>';
    }, 700);
  });
</script>



</body></html>
