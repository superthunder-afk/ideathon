<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="web_standard" name="shell-type">
<title>GD Arena — Topic &amp; Cohort Setup</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        background-color: #fcfaf7;
      }
      body {
        overscroll-behavior: none;
      }
    }
    textarea:focus {
      outline: none;
    }
    ::selection {
      background: #f8dec9;
      color: #1b1b1c;
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "secondary": "#6e5b4b",
            "outline": "#8a726a",
            "primary": "#9f3c16",
            "on-background": "#1b1b1c",
            "surface": "#fcfaf7",
            "tertiary": "#146940",
            "background": "#fcfaf7",
            "on-surface": "#1b1b1c",
            "secondary-container": "#f8dec9",
            "primary-container": "#bf542c",
            "on-primary": "#ffffff",
          },
          fontFamily: {
            "editorial": ["Newsreader", "serif"],
            "display": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#fcfaf7] text-on-surface font-body min-h-screen flex flex-col justify-between selection:bg-secondary-container">
<!-- Minimal Header -->
<header class="w-full pt-8 pb-4 px-8 md:px-16 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="font-display font-medium text-lg tracking-tight text-[#1b1b1c]">GD Arena</span>
<span class="text-xs text-[#8a726a]/60 tracking-wider font-light">/</span>
<span class="text-xs tracking-wider text-[#6e5b4b]/70 uppercase">Ready</span>
</div>
<nav class="flex items-center gap-8 text-sm text-[#6e5b4b]">
<a class="text-[#1b1b1c] font-medium" href="#">Setup</a>
<a class="hover:text-[#1b1b1c] transition-colors" data-path="arena-live" href="#">Arena</a>
<a class="hover:text-[#1b1b1c] transition-colors" data-path="post-deliberation-brief" href="#">Brief</a>
</nav>
</header>
<!-- Center Zen Stage -->
<main class="w-full max-w-4xl mx-auto px-6 md:px-12 py-16 md:py-24 flex flex-col items-center my-auto">
<!-- Big confident editorial question -->
<h1 class="font-editorial text-4xl sm:text-5xl md:text-6xl text-[#1b1b1c] tracking-[-0.03em] font-normal text-center leading-[1.15] max-w-2xl mb-12">What do you want to discuss?</h1>
<!-- Pure typographic topic input -->
<div class="w-full max-w-2xl flex flex-col items-center mb-14">
<textarea class="w-full text-center bg-transparent border-0 border-b border-[#dec0b7]/50 focus:border-[#9f3c16] pb-4 pt-1 font-editorial text-2xl sm:text-3xl text-[#1b1b1c] placeholder:text-[#8a726a]/40 resize-none leading-snug transition-colors duration-300" id="topic-input" placeholder="Type your topic..." rows="2">Should AI replace traditional university education?</textarea>
</div>
<!-- Minimalist Participant Selector: 3 · 4 · 5 participants -->
<div class="flex items-center justify-center gap-3 text-sm md:text-base text-[#8a726a] mb-14">
<button class="participant-opt px-2 py-1 hover:text-[#1b1b1c] transition-colors cursor-pointer" data-val="3" type="button">3</button>
<span class="text-[#dec0b7] select-none">·</span>
<button class="participant-opt px-2 py-1 text-[#9f3c16] font-medium transition-colors cursor-pointer" data-val="4" type="button">4</button>
<span class="text-[#dec0b7] select-none">·</span>
<button class="participant-opt px-2 py-1 hover:text-[#1b1b1c] transition-colors cursor-pointer" data-val="5" type="button">5</button>
<span class="text-[#8a726a]/70 ml-1 font-light">participants</span>
</div>
<!-- Quiet, elegant action button -->
<button class="group relative inline-flex items-center justify-center px-10 py-4 rounded-full bg-[#1b1b1c] text-[#fcfaf7] font-display text-base font-normal tracking-wide hover:bg-[#9f3c16] transition-all duration-300 shadow-sm hover:shadow-md cursor-pointer" id="begin-btn" type="button">
<span class="relative">Begin Deliberation</span>
</button>
</main>
<!-- Quiet Minimal Footer -->
<footer class="w-full py-8 px-8 md:px-16 flex items-center justify-between text-xs text-[#8a726a]/60">
<span class="">GD Arena</span>
<span class="">Quiet focus mode</span>
</footer>
<script>
    // Participant selection toggle
    const participantBtns = document.querySelectorAll('.participant-opt');
    participantBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        participantBtns.forEach(b => {
          b.classList.remove('text-[#9f3c16]', 'font-medium');
          b.classList.add('text-[#8a726a]');
        });
        btn.classList.add('text-[#9f3c16]', 'font-medium');
        btn.classList.remove('text-[#8a726a]');
      });
    });

    // Begin deliberation navigation
    const beginBtn = document.getElementById('begin-btn');
    if (beginBtn) {
      beginBtn.addEventListener('click', () => {
        const originalText = beginBtn.querySelector('span').innerText;
        beginBtn.querySelector('span').innerText = 'Convening...';
        setTimeout(() => {
          const liveLink = document.querySelector('a[data-path="arena-live"]');
          if (liveLink) {
            liveLink.click();
          } else {
            beginBtn.querySelector('span').innerText = originalText;
          }
        }, 600);
      });
    }
  </script>


</body></html>
